services:
  localstack:
    image: localstack/localstack:3.8
    container_name: devflow-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - devflow

  # Jaeger all-in-one — collector + UI + memory-only storage. Exposes
  # the OTLP/HTTP receiver on 4318 (where the services send spans) and
  # the UI on 16686. Memory storage is fine for a demo; in production
  # you'd point the services at a real OTel collector instead.
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: devflow-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP
    networks:
      - devflow
    restart: unless-stopped

  aws-init:
    image: amazon/aws-cli:2.17.0
    container_name: devflow-aws-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    entrypoint: ["/bin/bash", "/init/init-aws.sh"]
    volumes:
      - ./infra/localstack/init-aws.sh:/init/init-aws.sh:ro
    networks:
      - devflow
    restart: "no"

  aggregator:
    build:
      context: ./services/aggregator
      dockerfile: Dockerfile
    container_name: devflow-aggregator
    depends_on:
      aws-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - PROCESSED_EVENTS_QUEUE=processed-events
      - EVENTS_TABLE=events
      - SUMMARY_TABLE=developer_summary
      - AGGREGATOR_WORKERS=5
      - SQS_WAIT_TIME_SECONDS=10
      - HTTP_ADDR=:8080
      - LOG_LEVEL=info
      # OpenTelemetry: empty endpoint disables tracing. Set to
      # http://jaeger:4318 (the bundled collector) to enable.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
      - "8080:8080"
    networks:
      - devflow
    restart: unless-stopped

  processor:
    build:
      context: ./services/processor
      dockerfile: Dockerfile
    container_name: devflow-processor
    depends_on:
      aws-init:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - RAW_EVENTS_QUEUE=raw-events
      - PROCESSED_EVENTS_QUEUE=processed-events
      # PROCESSOR_ID intentionally unset → defaults to the container
      # hostname so multi-replica setups self-identify in logs.
      - PROCESSOR_WORKERS=5
      - SQS_WAIT_TIME_SECONDS=10
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_INSECURE=true
    networks:
      - devflow
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # Visual tools — opt-in via `--profile tools` so they don't slow the
  # default `docker-compose up`. Run with: `docker compose --profile tools up -d`
  # or `make tools`.
  # ────────────────────────────────────────────────────────────────────

  # DynamoDB Admin GUI → http://localhost:8001
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: devflow-dynamodb-admin
    profiles: ["tools"]
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "8001:8001"
    networks:
      - devflow

  # SQS depth: visualized via `make watch` (see Makefile). Pure-CLI
  # `watch` of queue sizes turned out friendlier than any open-source
  # SQS GUI I trust against LocalStack. Keep it simple.

networks:
  devflow:
    driver: bridge
